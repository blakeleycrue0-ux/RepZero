<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepZero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0a0c;
    --surface:#141417;
    --surface-2:#1c1c20;
    --border:#28282e;
    --text:#f4f4f5;
    --text-dim:#8a8a92;
    --accent:#d4ff3f;
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:400px;
  }
  .logo{
    font-family:'Bebas Neue', sans-serif;
    font-size:56px;
    letter-spacing:2px;
    line-height:1;
    margin-bottom:4px;
  }
  .logo span{ color:var(--accent); }
  .tagline{
    color:var(--text-dim);
    font-size:14px;
    margin-bottom:40px;
  }
  .toggle{
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:4px;
    margin-bottom:28px;
  }
  .toggle button{
    flex:1;
    padding:10px;
    background:none;
    border:none;
    border-radius:7px;
    color:var(--text-dim);
    font-family:'Inter';
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:.15s;
  }
  .toggle button.active{
    background:var(--surface-2);
    color:var(--text);
  }
  label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--text-dim);
    margin-bottom:6px;
    margin-top:18px;
  }
  input{
    width:100%;
    padding:13px 14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-family:'Inter';
    font-size:15px;
    outline:none;
    transition:.15s;
  }
  input:focus{
    border-color:var(--accent);
  }
  .submit{
    width:100%;
    margin-top:28px;
    padding:15px;
    background:var(--accent);
    color:#0a0a0c;
    border:none;
    border-radius:10px;
    font-family:'Inter';
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.15s;
  }
  .submit:hover{ opacity:.9; }
  .submit:disabled{ opacity:.5; cursor:not-allowed; }
  .msg{
    margin-top:16px;
    font-size:13px;
    text-align:center;
    min-height:18px;
  }
  .msg.error{ color:var(--danger); }
  .msg.success{ color:var(--accent); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">REP<span>ZERO</span></div>
  <div class="tagline">Tu entrenador con IA. Siempre listo.</div>

  <div class="toggle">
    <button id="tabLogin" class="active" onclick="setMode('login')">Iniciar sesión</button>
    <button id="tabSignup" onclick="setMode('signup')">Crear cuenta</button>
  </div>

  <form id="authForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password" minlength="6">

    <button type="submit" class="submit" id="submitBtn">Iniciar sesión</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
  const SUPABASE_URL = "https://sdixtismheecuqjxctyr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkaXh0aXNtaGVlY3VxanhjdHlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMzg1NTgsImV4cCI6MjA5ODkxNDU1OH0.tY8y3pawVJr358U7hmTX1bSjIkt6TwBapm2WK1JcTds";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = 'login';

  function setMode(m){
    mode = m;
    document.getElementById('tabLogin').classList.toggle('active', m==='login');
    document.getElementById('tabSignup').classList.toggle('active', m==='signup');
    document.getElementById('submitBtn').textContent = m==='login' ? 'Iniciar sesión' : 'Crear cuenta';
    document.getElementById('msg').textContent = '';
  }

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Un momento...';

    try {
      if (mode === 'signup') {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;

        // Create matching row in users table
        if (data.user) {
          await supabase.from('users').insert({ id: data.user.id, email: data.user.email });
        }

        msg.className = 'msg success';
        msg.textContent = 'Cuenta creada. Revisa tu email para confirmar.';
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        msg.className = 'msg success';
        msg.textContent = 'Sesión iniciada. Redirigiendo...';
        // TODO: redirect to onboarding or dashboard depending on onboarded status
        // window.location.href = 'onboarding.html';
      }
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err.message || 'Algo salió mal.';
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
