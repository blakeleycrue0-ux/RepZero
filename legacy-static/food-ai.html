<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepZero — Food AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#000; --surface:#0c0c0c; --border:#2a2a2a; --text:#fff; --text-dim:#6e6e6e; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; height:100vh; display:flex; flex-direction:column; }
  header{ padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; }
  header a{ color:var(--text-dim); text-decoration:none; font-size:20px; }
  .title{ font-family:'Bebas Neue'; font-size:26px; letter-spacing:1px; text-transform:uppercase; }

  #chat{ flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px; }
  .bubble{ max-width:82%; padding:13px 16px; font-size:15px; line-height:1.45; white-space:pre-wrap; }
  .bubble.assistant{ background:var(--surface); border:1px solid var(--border); align-self:flex-start; }
  .bubble.user{ background:#fff; color:#000; align-self:flex-end; font-weight:500; }
  .bubble.system{ align-self:center; color:var(--text-dim); font-size:11px; background:none; border:none; font-family:'JetBrains Mono'; text-transform:uppercase; letter-spacing:1px; }
  .typing{ display:flex; gap:4px; padding:15px 16px; }
  .typing span{ width:5px; height:5px; border-radius:50%; background:var(--text-dim); animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.3; } 40%{ opacity:1; } }

  form{ display:flex; gap:10px; padding:16px; border-top:1px solid var(--border); background:#000; }
  input{ flex:1; padding:14px 16px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'Inter'; font-size:15px; outline:none; }
  input:focus{ border-color:#fff; }
  button{ width:48px; height:48px; background:#fff; border:none; color:#000; font-size:18px; cursor:pointer; flex-shrink:0; }
  button:disabled{ opacity:.3; }
</style>
</head>
<body>

<header>
  <a href="home.html">←</a>
  <div class="title">Food AI</div>
</header>

<div id="chat"></div>

<form id="chatForm">
  <input id="userInput" type="text" placeholder="Pregunta lo que sea..." autocomplete="off" required>
  <button type="submit" id="sendBtn">→</button>
</form>

<script>
  const SUPABASE_URL = "https://sdixtismheecuqjxctyr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkaXh0aXNtaGVlY3VxanhjdHlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMzg1NTgsImV4cCI6MjA5ODkxNDU1OH0.tY8y3pawVJr358U7hmTX1bSjIkt6TwBapm2WK1JcTds";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let userId = null;
  let profile = null;
  let plan = null;
  let planRowId = null;
  let messages = [];

  const chatEl = document.getElementById('chat');
  const formEl = document.getElementById('chatForm');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  function addBubble(role, text){
    const div = document.createElement('div');
    div.className = 'bubble ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  function showTyping(){
    const div = document.createElement('div');
    div.className = 'bubble assistant typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  function hideTyping(){
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function logMessage(role, content){
    await supabase.from('chat_messages').insert({ user_id: userId, ai_type: 'food', role, content });
  }

  async function sendMessage(text){
    addBubble('user', text);
    messages.push({ role: 'user', content: text });
    logMessage('user', text);

    showTyping();
    sendBtn.disabled = true;
    try {
      const res = await fetch('/.netlify/functions/food-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'chat', messages, profile, plan })
      });
      const data = await res.json();
      hideTyping();

      let displayText = data.text || '';
      const jsonMatch = displayText.match(/```json\s*([\s\S]*?)```/);
      if (jsonMatch) displayText = displayText.replace(jsonMatch[0], '').trim();

      if (displayText) {
        addBubble('assistant', displayText);
        messages.push({ role: 'assistant', content: data.text });
        logMessage('assistant', displayText);
      }

      if (jsonMatch) {
        const update = JSON.parse(jsonMatch[1]);
        if (update.plan_update) {
          plan = update.content;
          await supabase.from('daily_plans').update({ content: plan, source: 'adjusted' }).eq('id', planRowId);
          addBubble('system', 'Plan actualizado');
        }
      }
    } catch (err) {
      hideTyping();
      addBubble('assistant', 'Se me cruzaron los cables, intenta de nuevo.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
    }
  }

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    sendMessage(text);
  });

  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    userId = session.user.id;

    const { data: gp } = await supabase.from('food_profile').select('*').eq('user_id', userId).maybeSingle();
    if (!gp || !gp.onboarded) { window.location.href = 'onboarding-food.html'; return; }
    profile = gp;

    const { data: plans } = await supabase.from('daily_plans')
      .select('id, content').eq('user_id', userId).eq('type', 'food')
      .order('created_at', { ascending: false }).limit(1);
    if (plans && plans[0]) { plan = plans[0].content; planRowId = plans[0].id; }

    const { data: history } = await supabase.from('chat_messages')
      .select('role, content').eq('user_id', userId).eq('ai_type', 'food')
      .order('created_at', { ascending: true }).limit(30);

    if (history && history.length) {
      history.forEach(m => {
        addBubble(m.role, m.content);
        messages.push({ role: m.role, content: m.content });
      });
    } else {
      addBubble('assistant', '¿Qué necesitas? Puedo ayudarte con dudas de tu plan, sustituir una comida, o ideas rápidas.');
    }
  })();
</script>

</body>
</html>
