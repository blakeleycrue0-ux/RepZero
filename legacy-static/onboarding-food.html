<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepZero — Food AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#000; --surface:#0c0c0c; --border:#2a2a2a; --text:#fff; --text-dim:#6e6e6e; --text-dim-2:#3d3d3d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; height:100vh; display:flex; flex-direction:column; }
  header{ padding:20px 22px 16px; border-bottom:1px solid var(--border); }
  .eyebrow{ font-family:'JetBrains Mono'; font-size:11px; color:var(--text-dim); font-weight:600; letter-spacing:2px; text-transform:uppercase; }
  .title{ font-family:'Bebas Neue'; font-size:30px; letter-spacing:1px; margin-top:2px; text-transform:uppercase; }
  .progress{ display:flex; gap:6px; margin-top:16px; }
  .progress div{ height:2px; flex:1; background:var(--text-dim-2); }
  .progress div.fill{ background:#fff; }

  #chat{ flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px; }
  .bubble{ max-width:82%; padding:13px 16px; font-size:15px; line-height:1.45; white-space:pre-wrap; }
  .bubble.assistant{ background:var(--surface); border:1px solid var(--border); align-self:flex-start; }
  .bubble.user{ background:#fff; color:#000; align-self:flex-end; font-weight:500; }
  .typing{ display:flex; gap:4px; padding:15px 16px; }
  .typing span{ width:5px; height:5px; border-radius:50%; background:var(--text-dim); animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.3; } 40%{ opacity:1; } }

  form{ display:flex; gap:10px; padding:16px; border-top:1px solid var(--border); background:#000; }
  input{ flex:1; padding:14px 16px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'Inter'; font-size:15px; outline:none; }
  input:focus{ border-color:#fff; }
  button{ width:48px; height:48px; background:#fff; border:none; color:#000; font-size:18px; cursor:pointer; flex-shrink:0; }
  button:disabled{ opacity:.3; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Food AI</div>
  <div class="title">Conozcámonos</div>
  <div class="progress">
    <div class="fill"></div><div></div><div></div><div></div><div></div>
  </div>
</header>

<div id="chat"></div>

<form id="chatForm">
  <input id="userInput" type="text" placeholder="Escribe tu respuesta..." autocomplete="off" required>
  <button type="submit" id="sendBtn">→</button>
</form>

<script>
  const SUPABASE_URL = "https://sdixtismheecuqjxctyr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkaXh0aXNtaGVlY3VxanhjdHlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMzg1NTgsImV4cCI6MjA5ODkxNDU1OH0.tY8y3pawVJr358U7hmTX1bSjIkt6TwBapm2WK1JcTds";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let userId = null;
  let messages = [];
  let step = 0;

  const chatEl = document.getElementById('chat');
  const formEl = document.getElementById('chatForm');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  function addBubble(role, text){
    const div = document.createElement('div');
    div.className = 'bubble ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }
  function showTyping(){
    const div = document.createElement('div');
    div.className = 'bubble assistant typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  function hideTyping(){
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }
  function updateProgress(){
    document.querySelectorAll('.progress div').forEach((f, i) => f.classList.toggle('fill', i <= step));
  }

  async function callAI(){
    showTyping();
    sendBtn.disabled = true;
    try {
      const res = await fetch('/.netlify/functions/food-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'onboarding', messages })
      });
      const data = await res.json();
      hideTyping();

      let displayText = data.text || '';
      const jsonMatch = displayText.match(/```json\s*([\s\S]*?)```/);
      if (jsonMatch) displayText = displayText.replace(jsonMatch[0], '').trim();

      if (displayText) {
        addBubble('assistant', displayText);
        messages.push({ role: 'assistant', content: data.text });
      }

      if (jsonMatch) {
        await finishOnboarding(JSON.parse(jsonMatch[1]));
      } else {
        step = Math.min(step + 1, 4);
        updateProgress();
      }
    } catch (err) {
      hideTyping();
      addBubble('assistant', 'Se me cruzaron los cables. ¿Puedes repetir eso?');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function finishOnboarding(payload){
    const { profile, plan } = payload;

    await supabase.from('food_profile').upsert({
      user_id: userId,
      goal: profile.goal,
      diet_type: profile.diet_type,
      allergies: profile.allergies,
      meals_per_day: profile.meals_per_day,
      onboarded: true
    });

    await supabase.from('daily_plans').insert({
      user_id: userId,
      date: new Date().toISOString().slice(0,10),
      type: 'food',
      content: plan,
      source: 'initial'
    });

    document.querySelectorAll('.progress div').forEach(f => f.classList.add('fill'));
    setTimeout(() => { window.location.href = 'home.html'; }, 1400);
  }

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    addBubble('user', text);
    messages.push({ role: 'user', content: text });
    inputEl.value = '';
    await callAI();
  });

  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    userId = session.user.id;

    const { data: existing } = await supabase.from('food_profile').select('onboarded').eq('user_id', userId).maybeSingle();
    if (existing && existing.onboarded) { window.location.href = 'home.html'; return; }

    await callAI();
  })();
</script>

</body>
</html>
