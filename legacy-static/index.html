<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepZero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#000; --surface:#0c0c0c; --border:#2a2a2a;
    --text:#fff; --text-dim:#6e6e6e; --danger:#fff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:400px; }
  .logo{ font-family:'Bebas Neue'; font-size:56px; letter-spacing:2px; line-height:1; }
  .tagline{ font-family:'JetBrains Mono'; color:var(--text-dim); font-size:12px; letter-spacing:.5px; text-transform:uppercase; margin-top:10px; margin-bottom:44px; }
  .toggle{ display:flex; border:1px solid var(--border); margin-bottom:32px; }
  .toggle button{ flex:1; padding:13px; background:none; border:none; color:var(--text-dim); font-family:'JetBrains Mono'; font-weight:600; font-size:12px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:.15s; }
  .toggle button.active{ background:#fff; color:#000; }
  label{ display:block; font-family:'JetBrains Mono'; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px; margin-top:20px; }
  input{ width:100%; padding:14px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'Inter'; font-size:15px; outline:none; transition:.15s; }
  input:focus{ border-color:#fff; }
  .submit{ width:100%; margin-top:32px; padding:16px; background:#fff; color:#000; border:none; font-family:'JetBrains Mono'; font-weight:700; font-size:13px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:.15s; }
  .submit:hover{ opacity:.85; }
  .submit:disabled{ opacity:.4; cursor:not-allowed; }
  .msg{ margin-top:16px; font-family:'JetBrains Mono'; font-size:12px; text-align:center; min-height:16px; letter-spacing:.3px; }
  .msg.error{ color:#fff; text-decoration:underline; }
  .msg.success{ color:var(--text-dim); }
  .loading-screen{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:10; }
  .loading-screen .logo{ opacity:.3; }
  .hidden{ display:none; }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="logo">REPZERO</div>
</div>

<div class="card hidden" id="authCard">
  <div class="logo">REPZERO</div>
  <div class="tagline">Tu entrenador con IA</div>

  <div class="toggle">
    <button id="tabLogin" class="active" onclick="setMode('login')">Iniciar sesión</button>
    <button id="tabSignup" onclick="setMode('signup')">Crear cuenta</button>
  </div>

  <form id="authForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password" minlength="6">

    <button type="submit" class="submit" id="submitBtn">Iniciar sesión</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
  const SUPABASE_URL = "https://sdixtismheecuqjxctyr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkaXh0aXNtaGVlY3VxanhjdHlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMzg1NTgsImV4cCI6MjA5ODkxNDU1OH0.tY8y3pawVJr358U7hmTX1bSjIkt6TwBapm2WK1JcTds";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = 'login';

  function setMode(m){
    mode = m;
    document.getElementById('tabLogin').classList.toggle('active', m==='login');
    document.getElementById('tabSignup').classList.toggle('active', m==='signup');
    document.getElementById('submitBtn').textContent = m==='login' ? 'Iniciar sesión' : 'Crear cuenta';
    document.getElementById('msg').textContent = '';
  }

  async function routeUser(userId){
    const { data: gymProfile } = await supabase.from('gym_profile').select('onboarded').eq('user_id', userId).maybeSingle();
    if (!gymProfile || !gymProfile.onboarded) { window.location.href = 'onboarding-gym.html'; return; }
    const { data: foodProfile } = await supabase.from('food_profile').select('onboarded').eq('user_id', userId).maybeSingle();
    if (!foodProfile || !foodProfile.onboarded) { window.location.href = 'onboarding-food.html'; return; }
    window.location.href = 'home.html';
  }

  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) { await routeUser(session.user.id); return; }
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('authCard').classList.remove('hidden');
  })();

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Un momento...';

    try {
      if (mode === 'signup') {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;

        if (data.user) {
          await supabase.from('users').insert({ id: data.user.id, email: data.user.email });
        }

        if (data.session) {
          msg.className = 'msg success';
          msg.textContent = 'Cuenta creada. Redirigiendo...';
          await routeUser(data.user.id);
        } else {
          msg.className = 'msg success';
          msg.textContent = 'Revisa tu email para confirmar.';
          btn.disabled = false;
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        msg.className = 'msg success';
        msg.textContent = 'Redirigiendo...';
        await routeUser(data.user.id);
      }
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err.message || 'Algo salió mal.';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
